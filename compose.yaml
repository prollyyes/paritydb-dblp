services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: dblp
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dblp"]
      interval: 2s
      timeout: 5s
      retries: 20

  fuseki:
    build:
      context: .
      dockerfile: Dockerfile.fuseki
    ports:
      - "3030:3030"
