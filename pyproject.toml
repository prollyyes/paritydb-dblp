[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dblp-backend-comparison"
version = "0.1.0"
description = "Reproducible PostgreSQL and Fuseki comparison over a DBLP subset"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "rdflib>=7.1,<8",
]

[project.optional-dependencies]
dev = ["matplotlib>=3.9,<4", "pytest>=8,<9"]

[project.scripts]
dm-extract = "dm_project.extract:main"
dm-emit-rdf = "dm_project.emit_rdf:main"
dm-load-postgres = "dm_project.load_postgres:main"
dm-load-fuseki = "dm_project.load_fuseki:main"
dm-benchmark = "dm_project.benchmark:main"
dm-advisor = "dm_project.advisor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
